version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: resumeai-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:alpine
    container_name: resumeai-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: resumeai-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MONGO_URI=mongodb://mongodb:27017/resumeai
      - JWT_SECRET=supersecret_resumeai_token_2026
      - ALLOWED_ORIGINS=http://localhost:5173
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: resumeai-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  mongo-data:
